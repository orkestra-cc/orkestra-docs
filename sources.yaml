# Sources from which content gets synced into this docs site.
#
# Three sync flows consume this file:
#   - scripts/sync-monorepo-docs.ts: mirrors hand-written content from
#       monorepo/docs/site/ into this repo's docs/ tree (the canonical
#       source-of-truth lives in the monorepo so non-Docusaurus tools
#       like GitHub web can render the same pages).
#   - scripts/sync-modules.ts: pulls README.md from each addon repo
#       → docs/modules/addons/<name>.mdx
#   - scripts/sync-adrs.ts: pulls monorepo ADRs that have `public: true`
#       in their frontmatter → docs/adrs/<filename>.mdx
#
# Each entry uses a git ref ("main" by default). Pin to a tag in CI for
# reproducible builds.

monorepo:
  url: https://github.com/orkestra-cc/orkestra
  ref: main

  adrs:
    glob: docs/adr/*.md           # only files with frontmatter `public: true` are synced

  # Hand-written Docusaurus pages whose source lives in the monorepo.
  # Two flavors:
  #   - mirror: wipe the destination directory and copy the entire source
  #             tree. Use for sections that are 100% monorepo-sourced.
  #   - files:  overwrite specific files only. Use for sections that mix
  #             monorepo-sourced files with locally-generated ones
  #             (e.g. modules/addons/<name>.mdx is generated by
  #             sync-modules.ts, but the section index is hand-written).
  site:
    mirror:
      - {src: docs/site/getting-started,  dst: docs/getting-started}
      - {src: docs/site/architecture,     dst: docs/architecture}
      - {src: docs/site/operating,        dst: docs/operating}
      - {src: docs/site/sdk,              dst: docs/sdk}
      - {src: docs/site/contributing,     dst: docs/contributing}
      - {src: docs/site/modules/core,     dst: docs/modules/core}
    files:
      - {src: docs/site/intro.mdx,                       dst: docs/intro.mdx}
      - {src: docs/site/modules/index.mdx,               dst: docs/modules/index.mdx}
      - {src: docs/site/modules/addons/index.mdx,        dst: docs/modules/addons/index.mdx}
      - {src: docs/site/modules/addons/_category_.json,  dst: docs/modules/addons/_category_.json}
      - {src: docs/site/adrs/index.mdx,                  dst: docs/adrs/index.mdx}
      - {src: docs/site/api/index.mdx,                   dst: docs/api/index.mdx}

addons:
  - name: billing
    url: https://github.com/orkestra-cc/orkestra-billing
    ref: main
  - name: documents
    url: https://github.com/orkestra-cc/orkestra-documents
    ref: main
