name: Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # External trigger from the monorepo CI when source-of-truth content
  # changes (e.g. backend/openapi/enterprise.json regenerated, or
  # docs/site/** touched). Requires a PAT on the monorepo side to dispatch;
  # see monorepo/.github/workflows/ for the wiring.
  repository_dispatch:
    types: [monorepo-docs-changed, monorepo-openapi-changed]
  # Nightly backstop. The monorepo dispatch only watches the monorepo; addon
  # repos in sources.yaml can change without anything telling us. This reruns
  # the same sync + build + deploy so those edits land within a day. GitHub
  # disables cron schedules after 60 days without repo activity, so treat this
  # as a safety net, not a guarantee.
  schedule:
    - cron: '17 5 * * *'   # 05:17 UTC — off-peak, avoids the top-of-the-hour rush

permissions:
  contents: read
  deployments: write
  pull-requests: write   # for Cloudflare Pages preview comment

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build site
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Sync content
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Hard-fail on sync errors. There is no checked-in fallback content
        # since the site is monorepo-sourced (see sources.yaml) — a silent
        # sync failure would deploy with empty sections.
        run: npm run sync

      - name: Build
        env:
          # Algolia DocSearch — empty if not yet applied for; build is still
          # green, the search UI just doesn't render. See README.md.
          ALGOLIA_APP_ID: ${{ secrets.ALGOLIA_APP_ID }}
          ALGOLIA_SEARCH_API_KEY: ${{ secrets.ALGOLIA_SEARCH_API_KEY }}
          ALGOLIA_INDEX_NAME: ${{ secrets.ALGOLIA_INDEX_NAME }}
        run: npm run build

      - name: Deploy to Cloudflare Pages
        if: success()
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build --project-name=orkestra-docs --branch=${{ github.head_ref || github.ref_name }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
